name: ci

on:
  push:
  pull_request:

env:
  PYTHONIOENCODING: utf-8

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Python packages
        run: python -m pip install lz4 numpy pillow
      - name: Repo gate (syntax, JSON + mod validation, no game files, public safety, hygiene)
        run: python scripts/check_repo.py
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $e = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e) | Out-Null
            if ($e.Count) { $bad++; Write-Host "::error file=scripts/$($_.Name)::$($e[0].Message)" }
          }
          if ($bad) { exit 1 }
      - name: Example mods package
        run: |
          python scripts/pack_mod.py --list
          python scripts/release_ci.py --build
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Build companion apps
        run: |
          dotnet build src/Dirt5.TrackCompanion -c Release
          dotnet build src/Dirt5.SaveInspector -c Release
