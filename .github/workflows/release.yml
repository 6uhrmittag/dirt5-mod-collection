name: release

# One GitHub release per tool (d5ml/vX, unlocked/vX) and per example mod (mod/<id>/vX).
# A unit is released when its version (release.json / mods/_example-*/mod.json) has no tag yet:
# bump the version, push to main, and this workflow builds + publishes just that unit.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: python -m pip install lz4 numpy pillow
      - name: Repo gate
        run: python scripts/check_repo.py
      - name: Plan
        run: python scripts/release_ci.py --dry
      - name: Build and publish new releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/release_ci.py
